# Linux worker preview: CPU-only by default. See docs/setup/linux-sidecar.md.
# Deploy separately on the worker host, then open http://<host>:8788 on a trusted
# network and pair with a code from Settings → Remote workers → Pair a sidecar.
services:
  optimisarr-sidecar:
    image: ghcr.io/jellman86/optimisarr-sidecar:${SIDECAR_TAG:-dev}
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      OPTIMISARR_SERVER: ${OPTIMISARR_SERVER:-}
      OPTIMISARR_PAIRING_CODE: ${OPTIMISARR_PAIRING_CODE:-}
      OPTIMISARR_WORKER_NAME: ${OPTIMISARR_WORKER_NAME:-Linux worker}
      OPTIMISARR_CONCURRENCY: ${OPTIMISARR_CONCURRENCY:-1}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "8788:8788"
    volumes:
      - sidecar-config:/config
      - sidecar-work:/work
    # Optional Intel QSV / VAAPI: uncomment on a host with /dev/dri/renderD128.
    # devices:
    #   - /dev/dri:/dev/dri
    # Optional RAM scratch: replace the /work volume above with this bounded tmpfs.
    # Do not mount both a volume and tmpfs at /work. Match uid/gid to PUID/PGID.
    # Leave enough RAM for FFmpeg and the host; there is no disk fallback.
    # tmpfs:
    #   - /work:size=8g,mode=0700,uid=1000,gid=1000
volumes:
  sidecar-config:
  sidecar-work:
