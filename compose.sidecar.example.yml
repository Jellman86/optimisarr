# Deploy separately on the worker host. Enable remote workers and generate a code
# in the server's Settings → Workers before the first start.
services:
  optimisarr-sidecar:
    image: ghcr.io/jellman86/optimisarr-sidecar:${SIDECAR_TAG:-dev}
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      OPTIMISARR_SERVER: ${OPTIMISARR_SERVER:-http://optimisarr:8787}
      OPTIMISARR_PAIRING_CODE: ${OPTIMISARR_PAIRING_CODE:-}
      OPTIMISARR_WORKER_NAME: ${OPTIMISARR_WORKER_NAME:-Linux worker}
      OPTIMISARR_CONCURRENCY: ${OPTIMISARR_CONCURRENCY:-1}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "8788:8788"
    volumes:
      - sidecar-config:/config
      - sidecar-work:/work
    # Intel QSV / VAAPI. Remove for a CPU-only worker.
    devices:
      - /dev/dri:/dev/dri
    # Optional RAM scratch: replace the /work volume above with this bounded tmpfs.
    # Leave enough RAM for FFmpeg and the host; exhausted scratch fails the job safely.
    # tmpfs:
    #   - /work:size=8g,mode=0700,uid=1000,gid=1000
volumes:
  sidecar-config:
  sidecar-work:
