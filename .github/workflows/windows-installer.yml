name: Windows sidecar installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
    paths:
      - 'sidecars/windows/**'
      - 'scripts/build_audio_quality.sh'
      - 'tools/audio-quality-native/**'
      - '.github/workflows/windows-installer.yml'
      - 'src/Optimisarr.Core/**'
      - 'Directory.Build.props'
      - 'scripts/sidecar_release_version.py'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python scripts/sidecar_release_version.py
      - run: dotnet build sidecars/windows/Optimisarr.Sidecar.slnx -c Release -warnaserror
      - run: dotnet test sidecars/windows/tests/Optimisarr.Sidecar.Core.Tests -c Release --no-build
      - run: ./sidecars/windows/installer/test-evidence.ps1
      - run: ./sidecars/windows/installer/test-process.ps1
      - run: ./sidecars/windows/installer/test-health.ps1
      - run: ./sidecars/windows/installer/build.ps1 -BuildUpgradeTest
      - name: Verify real MSI identity metadata
        run: ./sidecars/windows/installer/test-health.ps1 -Installer (Get-ChildItem sidecars/windows/artifacts/*.msi).FullName
      - name: Exercise the bundled audio verifier and spectrogram
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'optimisarr-audio-tools'
          ./sidecars/windows/scripts/fetch-ffmpeg.ps1 -Destination $tools -Force
          $env:OPTIMISARR_PREVIEW_FFMPEG = Join-Path $tools 'ffmpeg.exe'
          dotnet test sidecars/windows/tests/Optimisarr.Sidecar.Core.Tests -c Release --no-build --filter Native_ffmpeg
      - id: smoke
        timeout-minutes: 20
        run: ./sidecars/windows/installer/test-install.ps1 -Installer (Get-ChildItem sidecars/windows/artifacts/*.msi).FullName -UpgradeInstaller sidecars/windows/artifacts/upgrade-test/OptimisarrSidecar-upgrade-test.msi
      - name: Verify installer evidence is retained
        if: always() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        run: |
          $evidence = @(Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'optimisarr-install-test-*')
          if ($evidence.Count -ne 1 -or !(Test-Path (Join-Path $evidence[0].FullName 'install.log'))) {
            throw 'Installer evidence is missing from the uploaded runner temporary directory.'
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-sidecar-unsigned-preview
          path: |
            sidecars/windows/artifacts/*.msi
            sidecars/windows/artifacts/*.sha256
            sidecars/windows/artifacts/*-update.zip
            ${{ runner.temp }}/optimisarr-install-test-*/**

  publish:
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-sidecar-unsigned-preview
          path: artifacts
      - name: Attach tested Windows preview to the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.msi
            artifacts/**/*.msi.sha256
            artifacts/**/*-update.zip
            artifacts/**/*-update.zip.sha256
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
