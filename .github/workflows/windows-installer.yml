name: Windows sidecar installer preview
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - 'sidecars/windows/**'
      - '.github/workflows/windows-installer.yml'
      - 'src/Optimisarr.Core/**'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: dotnet build sidecars/windows/Optimisarr.Sidecar.slnx -c Release -warnaserror
      - run: dotnet test sidecars/windows/tests/Optimisarr.Sidecar.Core.Tests -c Release --no-build
      - run: ./sidecars/windows/installer/build.ps1
      - run: ./sidecars/windows/installer/test-install.ps1 -Installer (Get-ChildItem sidecars/windows/artifacts/*.msi).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-sidecar-unsigned-preview
          path: |
            sidecars/windows/artifacts/*.msi
            sidecars/windows/artifacts/*.sha256
            ${{ runner.temp }}/optimisarr-install-test-*/**
